[build-system]
requires = ["hatchling >=0.25"]
build-backend = "hatchling.build"

[project]
name = "tomorrowcities"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
dependencies = [
    "solara==1.61",
    "anyio==4.4.0",
    "starlette<1.0",
    "geopandas",
    "ipyleaflet",
    "plotly",
    "lorem-text",
    "matplotlib",
    "psycopg2-binary",
    "scipy", 
    "pandas",
    "networkx",
    "openpyxl",
    "rasterio",
    "boto3",
    "cryptography",
    "ipydatagrid",
    "requests_oauthlib",
    "python-dotenv",
]

[tool.hatch.version]
path = "tomorrowcities/__init__.py"



[project.urls]
Home = "https://github.com/tommy-hash/tcdse-azure"

[tool.black]
line-length = 160

[tool.isort]
profile = "black"
